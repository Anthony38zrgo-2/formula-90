[package]
name = "vehicle_physics_engine"
version = "0.1.0"
edition = "2021"
description = "Formula-90 GEVP-aligned tri-raycast vehicle force solver: suspension, brush tires, drivetrain and telemetry with Godot RigidBody3D integration."
license = "LicenseRef-Proprietary"
publish = false

[lib]
name = "vehicle_physics_engine"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "physics_cli"
path = "src/bin/physics_cli.rs"

[[bin]]
name = "tire_sweep"
path = "src/bin/tire_sweep.rs"

[[bin]]
name = "telemetry_compare"
path = "src/bin/telemetry_compare.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
