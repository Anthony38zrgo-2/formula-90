# cargo-crap policy for the Formula-90 workspace.
#
# Binaries and build scripts are tooling, not library units: `cargo llvm-cov`
# runs the test binaries, so their `main`/CLI helpers never execute and always
# show 0% coverage. Their CRAP score is therefore meaningless as a quality gate.
# Same context split as the semgrep `unwrap/expect` tooling rule (CLEAN-03).
#
# `bin_support.rs` is tooling too: metadata helpers used only by the
# calibration binaries (physics_cli, tire_sweep), so it is never executed by
# the test binaries.
#
# The ABI boundary (`#[no_mangle] pub extern "C"`) does NOT carry an allow
# since CLEAN-12 (2026-09-12): the coverage pipeline normalizes the LCOV via
# `scripts/clean-code/merge_lcov.py`, deduplicating the double instantiation
# of crates ["rlib","cdylib"] and remapping `#[no_mangle]` counts from a
# `--lib` pass that records the real unit-test hits. The ABI wrappers report
# their actual coverage (CRAP = cyclomatic complexity) and no longer need an
# exclusion.
threshold = 30.0
allow = [
  "**/src/bin/**",
  "**/build.rs",
  "**/src/bin_support.rs",
]