[package]
name = "race_intelligence_engine"
version = "0.1.0"
edition = "2021"
description = "Formula-90 autonomous race intelligence: racing-line following, local control and scheduling for artificial drivers."
license = "LicenseRef-Proprietary"
publish = false

[lib]
name = "race_intelligence_engine"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "autonomous_driver_bridge"
path = "src/autonomous_driver_bridge.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
vehicle_physics_engine = { path = "../vehicle-physics-engine" }

[dev-dependencies]
parry3d-f64 = "=0.23.0"
