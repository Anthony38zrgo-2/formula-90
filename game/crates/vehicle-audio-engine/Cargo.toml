[package]
name = "vehicle_audio_engine"
version = "0.1.0"
edition = "2021"
description = "Formula-90 vehicle audio runtime core: deterministic mix state + sound bank loader + GEVP adapter (pure Rust, no Godot deps in the core)."
license = "proprietary"

[lib]
name = "vehicle_audio_engine"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"
v10-engine-synth = { path = "../v10-engine-synth" }

[dev-dependencies]

[profile.release]
lto = true
