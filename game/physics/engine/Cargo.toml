[package]
name = "vehicle_physics_engine"
version = "0.1.0"
edition = "2021"
description = "Formula-90 vehicle physics simulation core: deterministic 6-DOF rigid body, tri-raycast suspension, brush tire dynamics, powertrain and telemetry (pure Rust, no Godot deps in the core)."
license = "proprietary"

[lib]
name = "vehicle_physics_engine"
path = "src/lib.rs"

[[bin]]
name = "physics_cli"
path = "src/bin/physics_cli.rs"

[[bin]]
name = "telemetry_compare"
path = "src/bin/telemetry_compare.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]

[profile.release]
lto = true
opt-level = 3
