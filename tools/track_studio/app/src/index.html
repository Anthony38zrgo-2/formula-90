<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Formula90 Track Studio</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        color: #ddd;
        background: #1b1b1f;
      }
      #toolbar {
        display: flex;
        gap: 0.5rem;
        padding: 0.5rem 1rem;
        background: #2a2a30;
      }
      #toolbar button {
        background: #444;
        color: #eee;
        border: none;
        padding: 0.35rem 0.7rem;
        cursor: pointer;
      }
      #track-id {
        margin-left: auto;
        align-self: center;
        font-weight: 600;
      }
      #workspace {
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 1rem;
        padding: 1rem;
      }
      #viewport {
        background: #202027;
        border: 1px solid #333;
        min-height: 500px;
      }
      aside section {
        background: #232329;
        border: 1px solid #333;
        margin-bottom: 1rem;
        padding: 0.5rem;
      }
      aside h2 {
        margin: 0 0 0.5rem;
        font-size: 0.9rem;
        color: #aaa;
      }
      .diag-error { color: #f55; }
      .diag-warning { color: #fa3; }
      .diag-info { color: #8af; }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button id="open">Open</button>
      <button id="save">Save</button>
      <button id="undo">Undo</button>
      <button id="redo">Redo</button>
      <button id="validate">Validate</button>
      <span id="track-id"></span>
    </div>
    <div id="workspace">
      <div id="viewport"></div>
      <aside>
        <section>
          <h2>Problems</h2>
          <div id="problems"></div>
        </section>
        <section>
          <h2>Build</h2>
          <button id="build">Compile &amp; Plan</button>
          <div id="build-output"></div>
        </section>
        <section>
          <h2>Reference</h2>
          <input id="reference-path" placeholder="image path" />
          <input id="reference-x" type="number" value="0" />
          <input id="reference-z" type="number" value="0" />
          <button id="reference-add">Add</button>
          <div id="reference-output"></div>
        </section>
      </aside>
    </div>
    <script type="module" src="./js/ui/app.js"></script>
  </body>
</html>
