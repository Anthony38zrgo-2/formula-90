[package]
name = "track-studio-tauri"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone crate (kept out of the parent workspace to avoid pulling the Tauri
# toolchain into the core crates' test/build loop).
[workspace]

[lib]
name = "track_studio_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
track-service = { path = "../../crates/track-service" }
track-domain = { path = "../../crates/track-domain" }
