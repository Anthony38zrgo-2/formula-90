# commons bank configuration.
# The bank is derived from the original F1-1998 engine internal + Grand Prix
# sample set in
# game/sounds/bank_sources/legacy_formula_one_1998/. No synthesis.

bank_name: commons
source_dir: game/sounds/bank_sources/legacy_formula_one_1998
sample_rate: 44100
channels: 1
pcm_bits: 16
# Loop seam crossfade in frames (~46 ms) applied to loopable entries.
loop_xfade_frames: 2048
# Peak normalization ceiling.
normalization_peak: 0.89
# Continuous sampled voices retired in favour of the procedural synth.
retired_keys:
  - engine_high
  - engine_idle
  - engine_limiter
  - engine_low
  - engine_mid
  - engine_redline
  - engine_tc
  - exhaust-mic
