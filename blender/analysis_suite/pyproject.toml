[project]
name = "formula90s-analysis-suite"
version = "1.0.0"
description = "Deterministic headless Blender 3D analysis suite (ANL-001)"
requires-python = ">=3.11"
dependencies = []
license = { text = "proprietary" }

[tool.pytest]
addopts = ""

# The suite declares ZERO third-party runtime dependencies and runs from
# source only. No virtual environment is created or required. Run with
# Blender 5.2's bundled Python:
#
#   & "C:\Program Files\Blender Foundation\Blender 5.2\5.2\python\bin\python.exe" ^
#       blender\analysis_suite\scripts\run_analysis.py <subcommand> ^
#       --config <repo-relative-json> --report <repo-relative-json>
#
# Tests (unittest, stdlib only):
#   & "C:\Program Files\Blender Foundation\Blender 5.2\5.2\python\bin\python.exe" ^
#       -m unittest discover -s blender\analysis_suite\tests -v
